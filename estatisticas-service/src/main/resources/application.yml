server:
  port: 8083

spring:
  application:
    name: estatisticas-service
  datasource:
    url: jdbc:postgresql://localhost:5435/estatisticas
    username: lettergames
    password: lettergames
    hikari:
      # Banco fora aparece rápido como falha transitória e entra no retry do consumidor.
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # O backoff dorme entre polls: um intervalo (até 30s) precisa caber aqui com folga (validado no startup).
        max.poll.interval.ms: 300000
    producer:
      # Usado só pela DLT: reenvia o value original (String) para inspeção.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      # Offset só é commitado depois que o listener retorna (após o commit no banco).
      ack-mode: record
      concurrency: 3

estatisticas:
  retry:
    # Banco/conexão/lock fora: segura a partição (ordem) em vez de pular o evento.
    # 1s, 2s, 4s... até 30s por intervalo, por até 10 min no total; só então DLT.
    transitoria:
      intervalo-inicial: 1s
      multiplicador: 2
      intervalo-maximo: 30s
      tempo-maximo: 10m
    # Bug/regra: 1s, 2s, 4s (4 tentativas no total) e DLT.
    processamento:
      intervalo-inicial: 1s
      multiplicador: 2
      max-tentativas-extras: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.apache.kafka: WARN
    org.hibernate: WARN
    com.zaxxer: WARN
    # Ao derrubar o banco na demo, o pool avisa uma vez por conexão morta; o ⟳ RETRY já conta a história.
    com.zaxxer.hikari.pool.PoolBase: ERROR
    # A falha de SQL já aparece no ⟳ RETRY e no 503; o helper do Hibernate repetiria a mesma coisa em várias linhas.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.flywaydb: WARN
    org.springframework.kafka: WARN
