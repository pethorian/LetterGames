spring:
  datasource:
    url: jdbc:h2:mem:estatisticas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    listener:
      concurrency: 1

# Backoff curto para os testes de resiliência (50ms, 100ms, 200ms).
estatisticas:
  retry:
    intervalo-inicial: 50ms
    multiplicador: 2
    max-tentativas-extras: 3
