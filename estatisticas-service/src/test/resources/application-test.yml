spring:
  datasource:
    url: jdbc:h2:mem:estatisticas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    listener:
      concurrency: 1

logging:
  level:
    org.apache.zookeeper: WARN
    kafka: WARN
    state.change.logger: WARN

# Backoff curto para os testes de resiliência.
estatisticas:
  retry:
    # 50ms, 100ms, 200ms, 200ms... por até 10s.
    transitoria:
      intervalo-inicial: 50ms
      multiplicador: 2
      intervalo-maximo: 200ms
      tempo-maximo: 10s
    # 50ms, 100ms, 200ms → 4 tentativas.
    processamento:
      intervalo-inicial: 50ms
      multiplicador: 2
      max-tentativas-extras: 3
