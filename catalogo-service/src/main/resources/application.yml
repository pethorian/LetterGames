server:
  port: 8081

spring:
  application:
    name: catalogo-service
  datasource:
    url: jdbc:postgresql://localhost:5433/catalogo
    username: lettergames
    password: lettergames
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      # Timeouts curtos: com o Redis fora, o fallback para o banco precisa ser rápido.
      timeout: 500ms
      connect-timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Cache é opcional (ADR-004): Redis fora não pode derrubar o health do serviço.
    redis:
      enabled: false

catalogo:
  cache:
    tipo: redis
    ttl: 10m
    # Double delete: 2º evict após o commit varre valor antigo regravado por GET concorrente. 0 desliga.
    segundo-evict: 500ms

logging:
  level:
    org.hibernate: WARN
    com.zaxxer: WARN
    org.springframework.data.redis: WARN
    io.lettuce: WARN
    org.flywaydb: WARN
