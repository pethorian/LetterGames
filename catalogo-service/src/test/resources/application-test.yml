spring:
  datasource:
    url: jdbc:h2:mem:catalogo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    enabled: true

catalogo:
  cache:
    # Cache em memória: os testes rodam sem Redis nem Docker.
    tipo: memoria
    # 2º evict desligado por padrão: evita evict assíncrono em testes que contam idas ao banco.
    segundo-evict: 0
