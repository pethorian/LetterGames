# Perfil A: tudo em Docker. Uso: cp .env.example .env && docker compose up -d --build
# Cada serviço tem o seu Postgres (ADR-001). Configuração dos apps por variáveis SPRING_* (relaxed binding).
# Portas publicadas só em 127.0.0.1: ambiente local de demo, sem autenticação no Kafka UI/Redis.

x-postgres: &postgres
  image: postgres:16-alpine
  environment: &pg-env
    POSTGRES_USER: ${POSTGRES_USER:-lettergames}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lettergames}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 20

x-app: &app
  restart: unless-stopped
  environment: &app-env
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lettergames}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lettergames}
    JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1

services:
  postgres-catalogo:
    <<: *postgres
    environment:
      <<: *pg-env
      POSTGRES_DB: ${CATALOGO_DB:-catalogo}
    ports: ["127.0.0.1:5433:5432"]

  postgres-backlog:
    <<: *postgres
    environment:
      <<: *pg-env
      POSTGRES_DB: ${BACKLOG_DB:-backlog}
    ports: ["127.0.0.1:5434:5432"]

  postgres-estatisticas:
    <<: *postgres
    environment:
      <<: *pg-env
      POSTGRES_DB: ${ESTATISTICAS_DB:-estatisticas}
    ports: ["127.0.0.1:5435:5432"]

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,CONTROLLER://:9093,EXTERNO://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tópicos são criados pelos serviços (NewTopic), com partições declaradas.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["127.0.0.1:8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: lettergames
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  catalogo-service:
    <<: *app
    build:
      context: .
      args:
        MODULO: catalogo-service
    image: lettergames/catalogo-service:local
    ports: ["127.0.0.1:8081:8081"]
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-catalogo:5432/${CATALOGO_DB:-catalogo}
      SPRING_DATA_REDIS_HOST: redis
    healthcheck: &app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres-catalogo:
        condition: service_healthy
      redis:
        condition: service_healthy

  backlog-service:
    <<: *app
    build:
      context: .
      args:
        MODULO: backlog-service
    image: lettergames/backlog-service:local
    ports: ["127.0.0.1:8082:8082"]
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-backlog:5432/${BACKLOG_DB:-backlog}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CATALOGO_URL: http://catalogo-service:8081
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
    depends_on:
      postgres-backlog:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Só ordem de subida: o backlog sobrevive ao catálogo fora (circuit breaker).
      catalogo-service:
        condition: service_started

  estatisticas-service:
    <<: *app
    build:
      context: .
      args:
        MODULO: estatisticas-service
    image: lettergames/estatisticas-service:local
    ports: ["127.0.0.1:8083:8083"]
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-estatisticas:5432/${ESTATISTICAS_DB:-estatisticas}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
    depends_on:
      postgres-estatisticas:
        condition: service_healthy
      kafka:
        condition: service_healthy
